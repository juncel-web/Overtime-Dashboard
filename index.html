const cp=(r,o)=>{const rv=parseFloat(r)||0,ov=parseFloat(o)||0;return(rv+ov)>0?ov/(rv+ov):0;};
const fp=n=>(n*100).toFixed(1)+"%";
const fn=n=>(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
const ta=iso=>{const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return s+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return new Date(iso).toLocaleDateString();};

function toast(msg,type="success"){const c=type==="success"?"#10b981":type==="info"?"#3b82f6":"#ef4444";const bg=type==="success"?"#0d2a1e":type==="info"?"#0d1e2a":"#2a0d0d";const d=document.createElement("div");d.className="toast";d.style.cssText=`background:${bg};border:1px solid ${c};color:${c}`;d.textContent=(type==="success"?"✓ ":type==="info"?"↻ ":"✗ ")+msg;G("tc").appendChild(d);setTimeout(()=>d.remove(),3500);}

function r2m(rows){const m={};rows.forEach(r=>{m[r.key]={...r,data:typeof r.data==="string"?JSON.parse(r.data):r.data};});return m;}

function bld(subs){const live=JSON.parse(JSON.stringify(SEED));Object.values(subs).forEach(s=>{const{company,period,type,data}=s;if(!live[company])return;const b=type==="departments"?live[company].departments:live[company].costcenters;Object.entries(data||{}).forEach(([n,r])=>{const reg=parseFloat(r.reg)||0,ot=parseFloat(r.ot)||0;if(!reg&&!ot)return;if(!b[n])b[n]={};b[n][period]={reg,ot};});});return live;}

function gct(live,co){const d=live[co]?.departments||{};return PDS.map((p,i)=>{let reg=0,ot=0;Object.values(d).forEach(x=>{reg+=x[p]?.reg||0;ot+=x[p]?.ot||0;});return{period:SHP[i],fullPeriod:p,reg,ot,pct:cp(reg,ot)};});}

function rdash(){
  const co=S.dco,live=S.live,sv=S.dsv,clr=CLC[co];
  const data=gct(live,co),avg=data.reduce((s,d)=>s+d.pct,0)/data.length,totOT=data.reduce((s,d)=>s+d.ot,0),peak=data.reduce((a,b)=>a.pct>b.pct?a:b),latest=data[data.length-1];
  const depts=live[co]?.departments||{};
  document.querySelectorAll(".sbtn").forEach(b=>{const a=b.dataset.sv===sv;b.style.background=a?clr+"22":"transparent";b.style.color=a?clr:"#2a4060";});
  const kr=G("kpis");kr.innerHTML="";
  [{label:"Latest OT %",value:fp(latest.pct),sub:latest.fullPeriod,hi:latest.pct>0.1},{label:"Avg OT Rate",value:fp(avg),sub:"8-period avg",hi:avg>0.1},{label:"Total OT Hrs",value:fn(totOT),sub:"YTD"},{label:"Peak Period",value:peak.period,sub:fp(peak.pct)},{label:"Depts",value:Object.keys(depts).length,sub:co+" units"}].forEach(k=>{const d=document.createElement("div");d.className="kpi";d.innerHTML=`<div class="kpi-lbl">${k.label}</div><div class="kpi-val" style="${k.hi?"color:"+clr:""}">${k.value}</div>${k.sub?`<div class="kpi-sub">${k.sub}</div>`:""}`; if(k.hi)d.style.borderColor=clr+"55"; kr.appendChild(d);});
  const cnt=G("dcontent");cnt.innerHTML="";

  if(sv==="overview"){
    cnt.innerHTML=`<div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:3px">OT Rate Trend — ${co}</div><div style="font-size:11px;color:#2a4060;margin-bottom:10px">OT % of total hours</div><div style="height:220px;position:relative"><canvas id="cht1"></canvas></div></div><div class="g2"><div class="card"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:10px">Regular vs OT Hours</div><div style="height:190px;position:relative"><canvas id="cht2"></canvas></div></div><div class="card"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:12px">Dept OT Rankings</div><div id="dbars"></div></div></div>`;
    const drows=Object.entries(depts).map(([n,pd])=>({n,avg:PDS.reduce((s,p)=>s+cp(pd[p]?.reg||0,pd[p]?.ot||0),0)/PDS.length})).sort((a,b)=>b.avg-a.avg);
    const bw=G("dbars");if(bw){brows.innerHTML="";drows.forEach(d=>{const bc=d.avg>0.3?"#ef4444":d.avg>0.1?"#f59e0b":clr;const div=document.createElement("div");div.style.cssText="display:flex;align-items:center;gap:8px;margin-bottom:8px";div.innerHTML=`<div style="width:72px;font-size:11px;color:#6a809a;font-weight:600;flex-shrink:0">${d.n}</div><div style="flex:1;background:#0d1622;border-radius:3px;height:8px;overflow:hidden"><div style="width:${Math.min(d.avg*100,100)}%;height:100%;border-radius:3px;background:${bc}"></div></div><div style="width:44px;text-align:right;font-size:11px;font-weight:700;font-family:monospace;color:${bc}">${fp(d.avg)}</div>`;bw.appendChild(div);});}
    setTimeout(()=>{mkLine("cht1",SHP,[{label:"OT %",data:data.map(d=>+(d.pct*100).toFixed(2)),borderColor:clr,backgroundColor:clr+"22",fill:true}],v=>v+"%");mkBar("cht2",SHP,[{label:"Regular",data:data.map(d=>Math.round(d.reg)),backgroundColor:"#1a2640",stack:"a"},{label:"Overtime",data:data.map(d=>Math.round(d.ot)),backgroundColor:clr,stack:"a",borderRadius:{topLeft:4,topRight:4}}]);},50);
  }
  if(sv==="departments"){
    const drows=Object.entries(depts).map(([n,pd])=>({n,avg:PDS.reduce((s,p)=>s+cp(pd[p]?.reg||0,pd[p]?.ot||0),0)/PDS.length})).sort((a,b)=>b.avg-a.avg);
    const thc=SHP.map(p=>`<th style="text-align:center;font-size:10px">${p}</th>`).join("");
    const trs=drows.map(({n,avg:a})=>{const pd=depts[n]||{};const cells=PDS.map(p=>{const v=cp(pd[p]?.reg||0,pd[p]?.ot||0);return`<td style="text-align:center;font-family:monospace;font-size:11px;color:${pc(v)}">${v>0?fp(v):"—"}</td>`;}).join("");return`<tr><td style="font-weight:700;color:#8aa0b8;font-size:12px">${n}</td>${cells}<td style="text-align:center;font-family:monospace;font-weight:700;color:${pc(a)};font-size:11px">${fp(a)}</td></tr>`;}).join("");
    cnt.innerHTML=`<div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:10px">Dept OT Trends — ${co}</div><div style="height:260px;position:relative"><canvas id="cht3"></canvas></div></div><div class="card" style="overflow-x:auto"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:12px">Period-by-Period Table</div><table><thead><tr><th style="text-align:left">Dept</th>${thc}<th style="text-align:center">Avg</th></tr></thead><tbody>${trs}</tbody></table></div>`;
    const dnames=drows.map(d=>d.n);
    setTimeout(()=>{mkLine("cht3",SHP,dnames.map((n,i)=>({label:n,data:PDS.map(p=>+(cp(depts[n]?.[p]?.reg||0,depts[n]?.[p]?.ot||0)*100).toFixed(2)),borderColor:DPL[i%DPL.length],backgroundColor:"transparent",pointRadius:0,borderWidth:1.8})),v=>v+"%");},50);
  }
  if(sv==="compare"){
    const cmpd=PDS.map((p,i)=>{const r={period:SHP[i]};["ABC","PSC","CSI"].forEach(c=>{const ds=live[c]?.departments||{};let reg=0,ot=0;Object.values(ds).forEach(d=>{reg+=d[p]?.reg||0;ot+=d[p]?.ot||0;});r[c]=+(cp(reg,ot)*100).toFixed(2);});return r;});
    const cards=["ABC","PSC","CSI"].map(c=>{const d=gct(live,c),tOT=d.reduce((s,x)=>s+x.ot,0),a=d.reduce((s,x)=>s+x.pct,0)/d.length,pk=d.reduce((x,y)=>x.pct>y.pct?x:y),mx=Math.max(...d.map(x=>x.pct));const mb=d.map(x=>`<div style="flex:1"><div style="height:${mx>0?(x.pct/mx*34+2)+"px":"2px"};background:${x.pct>0.3?"#ef4444":x.pct>0.1?"#f59e0b":CLC[c]};border-radius:3px 3px 0 0;opacity:.85"></div></div>`).join("");return`<div style="background:#080e1a;border:1px solid ${CLC[c]}33;border-radius:12px;padding:16px"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><div style="width:7px;height:7px;border-radius:50%;background:${CLC[c]}"></div><span style="font-weight:800;color:${CLC[c]};font-size:13px">${c}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px">${[["Total OT",fn(tOT)],["Avg Rate",fp(a)],["Peak",pk.period],["Peak %",fp(pk.pct)]].map(([l,v])=>`<div><div style="font-size:9px;color:#2a4060;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px">${l}</div><div style="font-size:13px;font-weight:800;font-family:monospace;color:#c8d8e8">${v}</div></div>`).join("")}</div><div style="display:flex;gap:3px;align-items:flex-end;height:38px">${mb}</div></div>`;}).join("");
    cnt.innerHTML=`<div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;color:#c8d8e8;margin-bottom:10px">OT Rate — All Companies</div><div style="height:240px;position:relative"><canvas id="cht4"></canvas></div></div><div class="g3">${cards}</div>`;
    setTimeout(()=>{mkLine("cht4",SHP,[{label:"ABC",data:cmpd.map(d=>d.ABC),borderColor:CLC.ABC,backgroundColor:"transparent",pointRadius:4},{label:"PSC",data:cmpd.map(d=>d.PSC),borderColor:CLC.PSC,backgroundColor:"transparent",pointRadius:4},{label:"CSI",data:cmpd.map(d=>d.CSI),borderColor:CLC.CSI,backgroundColor:"transparent",pointRadius:4}],v=>v+"%");},50);
  }
}

// ENTRY
function initEntry(vcos){
  const wrap=G("ecobtns");
  if(vcos.length>1){const lbl=document.createElement("label");lbl.className="clbl";lbl.textContent="Company";wrap.appendChild(lbl);const row=document.createElement("div");row.style.cssText="display:flex;gap:7px";vcos.forEach(co=>{const b=document.createElement("button");b.className="cpill";b.dataset.eco=co;b.textContent=co;if(co===S.eco){b.style.borderColor=CLC[co];b.style.background=CLC[co]+"22";b.style.color=CLC[co];}b.onclick=()=>{S.eco=co;document.querySelectorAll("[data-eco]").forEach(p=>{const c=p.dataset.eco,ac=c===co;p.style.borderColor=ac?CLC[c]:"#131e30";p.style.background=ac?CLC[c]+"22":"transparent";p.style.color=ac?CLC[c]:"#2a4060";});rentryv();};row.appendChild(b);});wrap.appendChild(row);}
  const ps=G("eper");PDS.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;ps.appendChild(o);});ps.onchange=()=>{S.eper=ps.value;rentryv();};
  G("tdept").onclick=()=>{S.etab="departments";utabs();rentryv();};
  G("tcc").onclick=()=>{S.etab="costcenters";utabs();rentryv();};
  G("svbtn").onclick=dosave;
}
function utabs(){const clr=CLC[S.eco];G("tdept").style.background=S.etab==="departments"?clr+"33":"#060c18";G("tdept").style.color=S.etab==="departments"?clr:"#2a4060";G("tcc").style.background=S.etab==="costcenters"?clr+"33":"#060c18";G("tcc").style.color=S.etab==="costcenters"?clr:"#2a4060";}
function rentryv(){
  const co=S.eco,per=S.eper,tab=S.etab,clr=CLC[co],key=co+"::"+per+"::"+tab,saved=S.subs[key];
  const items=tab==="departments"?DEPTS[co]:CCS[co],src=tab==="departments"?S.live[co]?.departments:S.live[co]?.costcenters;
  G("svbtn").style.background=`linear-gradient(135deg,${clr},${clr}cc)`;utabs();
  if(saved){S.erows={...saved.data};}else{const rows={};items.forEach(n=>{const s=src?.[n]?.[per];rows[n]={reg:s?.reg!=null?String(s.reg):"",ot:s?.ot!=null?String(s.ot):""};});S.erows=rows;}
  const si=G("esaved");if(saved){si.style.display="block";si.textContent="✓ Saved "+ta(saved.submitted_at||saved.submittedAt)+" by "+(saved.submitted_by||saved.submittedBy);}else si.style.display="none";
  G("ethdr").innerHTML=`<span class="bdg" style="background:${clr}22;color:${clr};border:1px solid ${clr}44">${co}</span><span style="font-size:13px;font-weight:700;color:#c8d8e8">${per}</span><span style="font-size:11px;color:#1e3050">· ${tab}</span>${saved?`<span class="bdg" style="background:#10b98122;color:#10b981;border:1px solid #10b98144">✓ In Database</span>`:""}`;
  G("ethead").innerHTML=`<tr>${["#",tab==="departments"?"Department":"Cost Center","Reg Hrs","OT Hrs","OT %","Status"].map(h=>`<th style="text-align:${h==="#"||h==="OT %"||h==="Status"?"center":"left"}">${h}</th>`).join("")}</tr>`;
  const tb=G("etbody");tb.innerHTML="";
  items.forEach((item,idx)=>{const r=S.erows[item]||{reg:"",ot:""};const hb=r.reg!==""&&r.ot!=="";const pv=hb?cp(r.reg,r.ot):null;const st=r.reg!==""&&r.ot!==""?"<span style='font-size:10px;color:#10b981;font-weight:700'>✓</span>":r.reg!==""||r.ot!==""?"<span style='font-size:10px;color:#f59e0b;font-weight:700'>⚠</span>":"<span style='font-size:10px;color:#1e3050'>—</span>";const tr=document.createElement("tr");tr.innerHTML=`<td style="text-align:center;font-family:monospace;font-size:11px;color:#1e3050">${String(idx+1).padStart(2,"0")}</td><td style="font-weight:700;color:#8aa0b8">${item}</td><td style="padding:3px 6px"><input class="ei" type="number" min="0" step="0.01" placeholder="0.00" value="${r.reg}" data-item="${item}" data-field="reg"></td><td style="padding:3px 6px"><input class="ei" type="number" min="0" step="0.01" placeholder="0.00" value="${r.ot}" data-item="${item}" data-field="ot"></td><td style="text-align:center;font-family:monospace;font-size:13px;font-weight:700;color:${pv!==null?pc(pv):"#1e3050"}">${pv!==null?fp(pv):"—"}</td><td style="text-align:center">${st}</td>`;tb.appendChild(tr);});
  tb.querySelectorAll(".ei").forEach(inp=>{inp.oninput=()=>{const item=inp.dataset.item,field=inp.dataset.field;S.erows[item]={...S.erows[item],[field]:inp.value};uestats();const row=inp.closest("tr"),rv=S.erows[item],hb=rv.reg!==""&&rv.ot!=="",pv=hb?cp(rv.reg,rv.ot):null;row.cells[4].textContent=pv!==null?fp(pv):"—";row.cells[4].style.color=pv!==null?pc(pv):"#1e3050";row.cells[5].innerHTML=rv.reg!==""&&rv.ot!==""?"<span style='font-size:10px;color:#10b981;font-weight:700'>✓</span>":rv.reg!==""||rv.ot!==""?"<span style='font-size:10px;color:#f59e0b;font-weight:700'>⚠</span>":"<span style='font-size:10px;color:#1e3050'>—</span>";};});
  uestats();
}
function uestats(){const items=S.etab==="departments"?DEPTS[S.eco]:CCS[S.eco],rows=S.erows,tR=items.reduce((s,i)=>s+(parseFloat(rows[i]?.reg)||0),0),tO=items.reduce((s,i)=>s+(parseFloat(rows[i]?.ot)||0),0),op=cp(tR,tO),fl=items.filter(i=>rows[i]?.reg||rows[i]?.ot).length;const es=G("estats");es.innerHTML="";[{l:"Rows",v:`${fl}/${items.length}`,hi:false},{l:"Reg Hrs",v:fn(tR),hi:false},{l:"OT Hrs",v:fn(tO),hi:false},{l:"OT Rate",v:fp(op),hi:op>0.1}].forEach(({l,v,hi})=>{const d=document.createElement("div");d.className="kpi";if(hi)d.style.borderColor="#f59e0b55";d.innerHTML=`<div class="kpi-lbl">${l}</div><div class="kpi-val" style="${hi?"color:#f59e0b":""}">${v}</div>`;es.appendChild(d);});}
async function dosave(){const co=S.eco,per=S.eper,tab=S.etab,items=tab==="departments"?DEPTS[co]:CCS[co];if(!items.some(i=>S.erows[i]?.reg||S.erows[i]?.ot)){toast("Enter at least one row.","error");return;}const btn=G("svbtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Saving…';try{await DB.upsert({key:co+"::"+per+"::"+tab,company:co,period:per,type:tab,data:S.erows,submitted_by:S.user.username,submitted_at:new Date().toISOString(),status:"submitted"});await fetch2(true);toast(co+" · "+per+" saved!");rentryv();}catch(e){toast("Save failed: "+e.message,"error");}btn.disabled=false;btn.innerHTML="💾 Save to Database";}

// HISTORY
function rhist(){const vcos=S.user.company==="ALL"?["ABC","PSC","CSI"]:[S.user.company];const entries=Object.entries(S.subs).filter(([,v])=>vcos.includes(v.company)&&(S.hfil==="ALL"||v.company===S.hfil)).sort((a,b)=>new Date(b[1].submitted_at||b[1].submittedAt)-new Date(a[1].submitted_at||a[1].submittedAt));G("hcnt").textContent=entries.length+" database entries · shared across all users";const list=G("hlist");list.innerHTML="";if(!entries.length){list.innerHTML='<div style="text-align:center;padding:50px 0;color:#1e3050;font-size:14px">No submissions yet.</div>';return;}entries.forEach(([key,e])=>{const clr=CLC[e.company],items=e.type==="departments"?DEPTS[e.company]:CCS[e.company],tOT=items.reduce((s,i)=>s+(parseFloat(e.data?.[i]?.ot)||0),0),tReg=items.reduce((s,i)=>s+(parseFloat(e.data?.[i]?.reg)||0),0),pv=cp(tReg,tOT),ts=e.submitted_at||e.submittedAt,by=e.submitted_by||e.submittedBy;const dr=items.filter(i=>e.data?.[i]?.reg||e.data?.[i]?.ot).map(item=>{const r=e.data[item],p2=cp(r.reg||0,r.ot||0);return`<tr><td style="color:#8aa0b8;font-weight:600;font-size:12px">${item}</td><td style="text-align:right;font-family:monospace;color:#4b6080;font-size:11px">${parseFloat(r.reg||0).toFixed(2)}</td><td style="text-align:right;font-family:monospace;color:#4b6080;font-size:11px">${parseFloat(r.ot||0).toFixed(2)}</td><td style="text-align:right;font-family:monospace;font-weight:700;color:${pc(p2)};font-size:11px">${fp(p2)}</td></tr>`;}).join("");const row=document.createElement("div");row.className="hrow";row.innerHTML=`<div class="hhdr" onclick="var b=this.nextElementSibling;b.style.display=b.style.display==='block'?'none':'block';this.querySelector('.chv').style.transform=b.style.display==='block'?'rotate(180deg)':'none'"><div style="width:30px;height:30px;border-radius:7px;background:${CDM[e.company]};border:1px solid ${clr}44;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${clr};flex-shrink:0">${e.company}</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:#c8d8e8">${e.period}</div><div style="font-size:11px;color:#2a4060;text-transform:capitalize">${e.type} · ${by} · ${ta(ts)}</div></div><div style="text-align:right;margin-right:6px"><div style="font-size:12px;font-weight:800;font-family:monospace;color:${pc(pv)}">${fp(pv)}</div><div style="font-size:10px;color:#2a4060">OT Rate</div></div><div style="text-align:right;margin-right:8px"><div style="font-size:12px;font-weight:700;color:#8aa0b8;font-family:monospace">${fn(tOT)}</div><div style="font-size:10px;color:#2a4060">OT Hrs</div></div><div class="chv" style="font-size:13px;color:#1e3050;transition:transform .2s;margin-left:auto">▾</div></div><div class="hbody"><table><thead><tr><th style="text-align:left">${e.type==="departments"?"Dept":"CC"}</th><th style="text-align:right">Reg</th><th style="text-align:right">OT</th><th style="text-align:right">OT%</th></tr></thead><tbody>${dr}</tbody></table><div style="margin-top:8px;display:flex;justify-content:flex-end"><button onclick="ddel('${key.replace(/'/g,"\\'")}');" style="padding:5px 12px;border-radius:6px;border:1px solid #2a1515;background:transparent;color:#5a2020;font-size:12px;cursor:pointer;font-weight:600">🗑 Delete</button></div></div>`;list.appendChild(row);});}
async function ddel(key){if(!confirm("Delete from database?"))return;try{await DB.remove(key);await fetch2(true);toast("Deleted.");}catch(e){toast("Delete failed: "+e.message,"error");}}

// ADMIN
function radmin(){const subs=S.subs,ac=G("acards");ac.innerHTML="";["ABC","PSC","CSI"].forEach(co=>{const es=Object.values(subs).filter(e=>e.company===co),tOT=es.reduce((s,e)=>s+Object.values(e.data||{}).reduce((ss,r)=>ss+(parseFloat(r.ot)||0),0),0),pds=new Set(es.map(e=>e.period)).size,sub=[...new Set(es.map(e=>e.submitted_by||e.submittedBy))].length;const d=document.createElement("div");d.style.cssText=`background:#080e1a;border:1px solid ${CLC[co]}33;border-radius:12px;padding:15px`;d.innerHTML=`<div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><div style="width:7px;height:7px;border-radius:50%;background:${CLC[co]}"></div><span style="font-weight:800;color:${CLC[co]};font-size:13px">${co}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[["Submissions",es.length],["Periods",pds],["OT Hrs",fn(tOT)],["Submitters",sub||"—"]].map(([l,v])=>`<div><div style="font-size:9px;color:#2a4060;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px">${l}</div><div style="font-size:13px;font-weight:800;font-family:monospace;color:#c8d8e8">${v}</div></div>`).join("")}</div>`;ac.appendChild(d);});const ct=G("ctbl"),thc=["ABC","PSC","CSI"].map(c=>`<th style="text-align:center;color:${CLC[c]}">${c}</th>`).join("");let rows="";PDS.forEach(p=>{const cells=["ABC","PSC","CSI"].map(c=>{const n=(subs[c+"::"+p+"::departments"]?1:0)+(subs[c+"::"+p+"::costcenters"]?1:0);return`<td style="text-align:center">${n===2?`<span style="color:#10b981;font-weight:700;font-size:11px">✓ Complete</span>`:n===1?`<span style="color:#f59e0b;font-weight:700;font-size:11px">⚠ Partial</span>`:`<span style="color:#1e3050;font-size:11px">— Missing</span>`}</td>`;}).join("");rows+=`<tr><td style="font-family:monospace;font-size:11px;color:#4b6080">${p}</td>${cells}</tr>`;});ct.innerHTML=`<thead><tr><th style="text-align:left">Period</th>${thc}</tr></thead><tbody>${rows}</tbody>`;}
</script>
